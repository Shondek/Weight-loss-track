# בונה ופורס את האפליקציה ל-GitHub Pages.
#
# פעולה חד-פעמית בריפו: Settings ← Pages ← Source: GitHub Actions.
# אחרי זה כל דחיפה לענף שלמטה מפרסמת מחדש.
#
# אין דרך לעקוף את זה מתוך ה-workflow. נוסה enablement: true
# ב-configure-pages, גם בריפו פרטי וגם ציבורי, ובשניהם:
#   Create Pages site failed — Resource not accessible by integration
# יצירת אתר Pages היא פעולה ברמת admin, ו-GITHUB_TOKEN לא מקבל אותה
# גם עם permissions: pages: write.
#
# הכתובת שמתקבלת: https://<user>.github.io/<repo>/
# `base` ב-vite.config.ts הוא './', ולכן תת-תיקייה עובדת בלי הגדרה נוספת.

name: deploy

on:
  push:
    branches:
      - main
      - claude/personal-tracking-app-4xbd81
      - claude/nutrition-tracking-module-w3701c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# פריסה אחת בכל רגע. ריצה בתהליך לא נקטעת באמצע.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # לא פורסים בנייה שבורה
      - run: npm test
      - run: npm run build

      # ארטיפקט רגיל להורדה, לפני שלבי Pages. כך יש בנייה מוכנה גם אם
      # Pages כבוי — אפשר להוריד ולגרור לשירות סטטי אחר.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 30

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
