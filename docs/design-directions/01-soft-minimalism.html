:root{--bg:#F5F1E8;--surface:#FFFFFF;--surface-2:#FAF7F0;--ink:#1E1C17;--ink-2:#56534B;--ink-3:#6E6A61;--line:#E7E1D5;--line-2:#CFC7B8;--sage:#3E6B47;--sage-soft:#E2EBDC;--amber:#8A5A0B;--amber-soft:#F5E8CC;--slate:#586470;--slate-soft:#E4E8EB;--danger:#A14E33;}
/* ===== כיוון 1 — נייר (מינימליזם רך) =====
   רקע נייר חם, כרטיסים לבנים. כרטיס גיבור אחד בכל מסך עם רדיוס גדול וצל;
   כל שאר הכרטיסים — מסגרת בלבד, רדיוס קטן יותר, בלי צל. */
:root {
  --font: 'Heebo', system-ui, sans-serif;
  --icon-stroke: 1.75;
  --r-lg: 20px; --r-md: 12px; --r-sm: 8px; --r-pill: 999px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --tap: 48px;
  --shadow-hero: 0 1px 2px rgba(40, 30, 10, 0.05), 0 10px 28px -14px rgba(40, 30, 10, 0.22);
  --t-hero: 56px; --t-h1: 22px; --t-h2: 17px; --t-num: 28px; --t-body: 16px; --t-sub: 14px; --t-label: 13px; --t-micro: 12px;
  --nav-h: 64px;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: var(--t-body); line-height: 1.5; color: var(--ink); background: var(--bg);
  font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; -webkit-tap-highlight-color: transparent;
}
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.app { max-width: 390px; margin: 0 auto; min-height: 100dvh; }
.main { padding: var(--sp-4) var(--sp-4) calc(var(--nav-h) + var(--sp-6) + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: var(--sp-3); }
h1, h2, h3, p, ol, ul { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.ic { width: 20px; height: 20px; stroke-width: var(--icon-stroke); flex: 0 0 auto; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }

/* --- טיפוגרפיה --- */
.h1 { font-size: var(--t-h1); font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
.h2 { font-size: var(--t-h2); font-weight: 600; line-height: 1.3; }
.sub { font-size: var(--t-sub); color: var(--ink-2); line-height: 1.45; }
.label { font-size: var(--t-label); font-weight: 500; color: var(--ink-2); }
.eyebrow { font-size: var(--t-label); font-weight: 500; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.eyebrow .ic { width: 16px; height: 16px; }
.hero { font-size: var(--t-hero); font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
.hero-unit { font-size: var(--t-h2); color: var(--ink-2); margin-inline-start: 6px; align-self: flex-end; padding-bottom: 6px; }
.top { padding-top: var(--sp-2); display: grid; gap: 2px; }
.top--row { display: flex; align-items: center; gap: var(--sp-3); }
.top__center { text-align: center; display: grid; gap: var(--sp-2); justify-items: center; }

/* --- כרטיסים: שתי רמות --- */
.hero-card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-hero); padding: var(--sp-5) var(--sp-4) var(--sp-4); display: grid; gap: var(--sp-3); }
.hero-card--tight { gap: var(--sp-2); padding-bottom: var(--sp-4); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-4); }
.card--row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); }
.card__title { font-weight: 500; }
.hero-row { display: flex; align-items: flex-end; gap: var(--sp-2); flex-wrap: wrap; }
.hero-row .chip { margin-inline-start: auto; align-self: center; }
.hero-foot { display: flex; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; font-size: var(--t-sub); color: var(--ink-2); }
.trend-line { display: inline-flex; align-items: center; gap: 6px; }
.spark { width: 56px; height: 18px; }
.spark .ch-line { stroke: var(--ink-3); stroke-width: 1.5; fill: none; }

/* --- 7 ימים --- */
.d7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--sp-1); padding-top: var(--sp-1); }
.d7__cell { display: grid; justify-items: center; gap: 4px; font-size: var(--t-micro); color: var(--ink-3); }
.d7__dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line-2); }
.d7__cell.is-done .d7__dot { background: var(--ink); border-color: var(--ink); }
.d7__cell.is-missing .d7__dot { border-color: var(--amber); border-style: dashed; }
.d7__cell.is-today .d7__letter { color: var(--ink); font-weight: 600; }

/* --- צ׳יפים (סטטוס = מילה + צבע, לעולם לא צבע לבד) --- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-label); font-weight: 500; padding: 4px 10px; border-radius: var(--r-pill); line-height: 1.3; white-space: nowrap; }
.chip .ic { width: 14px; height: 14px; }
.chip--sage { background: var(--sage-soft); color: var(--sage); }
.chip--amber { background: var(--amber-soft); color: var(--amber); }
.chip--slate { background: var(--slate-soft); color: var(--slate); }
.chip--btn { background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); min-height: 40px; padding: 0 14px; font-size: 15px; }
.chip--btn.is-on { background: var(--sage); border-color: var(--sage); color: var(--surface); }
.chips { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

/* --- KPI --- */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); display: grid; gap: 6px; align-content: start; }
.kpi__label { font-size: var(--t-label); font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.kpi__label .ic { width: 16px; height: 16px; }
.kpi__value { display: flex; align-items: baseline; gap: 4px; font-size: var(--t-num); line-height: 1.1; }
.kpi__unit { font-size: var(--t-sub); color: var(--ink-2); }
.kpi__sub { font-size: var(--t-micro); color: var(--ink-3); }
.kpi .chip { justify-self: start; }

.bar { height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-pill); overflow: hidden; }
.bar--thick { height: 10px; }
.bar__fill { height: 100%; background: var(--sage); border-radius: var(--r-pill); }

/* --- שורות --- */
.day-row__icon { width: 26px; height: 26px; color: var(--slate); }
.day-row.is-closed { border-color: var(--sage); }
.day-row.is-closed .day-row__icon { color: var(--sage); }
.next .eyebrow { margin-bottom: var(--sp-2); }
.next__row { display: flex; align-items: center; gap: var(--sp-3); }
.next__name { font-size: var(--t-h2); font-weight: 500; }
.next__later { margin-top: var(--sp-3); padding-top: var(--sp-3); border-top: 1px solid var(--line); font-size: var(--t-label); color: var(--ink-3); }
.next-inline__icon { color: var(--ink-3); }
.list-card { padding: 0 var(--sp-4); }
.list-row { appearance: none; border: 0; background: none; width: 100%; min-height: 56px; display: flex; align-items: center; gap: var(--sp-3); text-align: start; padding: var(--sp-2) 0; border-top: 1px solid var(--line); }
.list-row:first-child, .list-row--flat { border-top: 0; }
.list-row__title { display: block; font-weight: 500; }
.list-row__icon { color: var(--ink-3); }
.list-row > .ic:last-child { color: var(--ink-3); }
.block { display: grid; gap: var(--sp-2); }
.block__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); min-height: 28px; }
.block__head .btn--quiet { min-height: 44px; margin-block: -8px; }

/* --- כפתורים --- */
.btn { appearance: none; min-height: var(--tap); padding: 0 var(--sp-4); border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn--primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn--quiet { border-color: transparent; background: none; color: var(--ink-2); padding-inline: var(--sp-2); }
.btn--block { width: 100%; }
.btn--tall { min-height: 56px; font-size: 17px; }

/* שקילות יומיות ל-9 שבועות — נגזרות דטרמיניסטית מהממוצעים השבועיים.
   רעש קטן וקבוע (לא אקראי) כדי שהצילומים יהיו זהים בכל ריצה. */
function dailyWeights() {
  const noise = [0.4, -0.2, 0.1, -0.5, 0.3, 0.0, -0.1, 0.5, -0.3, 0.2, -0.4, 0.1, 0.3, -0.2];
  const out = [];
  DATA.weeks.forEach((w, wi) => {
    for (let d = 0; d < 7; d++) {
      const i = wi * 7 + d;
      if (wi === DATA.weeks.length - 1) {
        const v = DATA.week.weights[d];
        out.push(v === null ? null : v);
      } else if (w.count < 7 && d === 2) {
        out.push(null);
      } else {
        out.push(Math.round((w.avg + noise[(i * 5) % noise.length]) * 10) / 10);
      }
    }
  });
  return out;
}
DATA.daily = dailyWeights();

    <section class="block">
      <div class="block__head"><h2 class="h2">מועדפים</h2><span class="sub">נגיעה = חלונית כמות</span></div>
      <div class="tiles">${DATA.nutrition.favorites

      <div class="card list-card">${DATA.nutrition.recent
        .map((f, i) => `<button class="list-row" data-act="openFood:recent:${i}"><span class="grow"><span class="list-row__title">${f.name}</span><span class="sub">${f.qty} · ${num(f.p)} ג׳ · ${num(f.kcal)} קק״ל</span></span>${icon('plus')}</button>`)
        .join('')}</div>
    </section>

    <section class="block">
      <div class="block__head"><h2 class="h2">מה נרשם היום</h2><span class="sub">${num(s.log.length)} רישומים</span></div>
      <div class="card log">${Object.keys(byTime)

        .map(
          (t) => `<div class="log__group"><div class="log__time num">${t}</div><div class="grow">${byTime[t]
            .map((e) => `<div class="log__row"><span class="grow">${e.name} <span class="sub">${e.qty}</span></span><span class="num log__p">${e.p} ג׳</span><span class="num sub">${e.kcal}</span></div>`)

  trend(s) {
    const weeks = DATA.weeks;

      <div class="grow"><h1 class="h1">מגמה</h1><p class="sub">ממוצע שבועי · הזמן מימין לשמאל</p></div>

    </header>

    <section class="hero-card hero-card--chart">

      <div class="legend">
        <span><i class="lg lg--line"></i> ממוצע שבועי מלא</span>
        <span><i class="lg lg--hollow"></i> שבוע חלקי</span>

      <div class="kpi"><div class="kpi__label">מתחילת התוכנית</div><div class="kpi__value"><span class="num">${fmt(lastFull.avg - first)}</span><span class="kpi__unit">ק״ג</span></div><div class="kpi__sub">${num(fmt(first))} → ${num(fmt(lastFull.avg))} · שבועות מלאים</div></div>

    <section class="card">
      <div class="block__head"><h2 class="h2">מותניים · ס״מ</h2><span class="chip chip--sage">${icon('check')} נמדד השבוע</span></div>
      ${waistChart()}
      <p class="sub">${num(fmt(w0))} → ${num(fmt(w1))} · ${num(fmt(w1 - w0))} ס״מ מ-${num(DATA.waist[0].d)} · נמדד ברביעי</p>
    </section>

    <section class="card list-card">
      <div class="block__head"><h2 class="h2">השבועות האחרונים</h2></div>

        .map((w) => `<div class="wk-row"><span class="grow">${w.label === 'השבוע' ? 'השבוע' : `שבוע ${num(w.label)}`}</span><span class="chip ${w.count === 7 ? 'chip--sage' : 'chip--amber'}">${w.count === 7 ? 'מלא' : 'חלקי'} · ${num(w.count + '/7')}</span><span class="num wk-row__val">${fmt(w.avg)}</span></div>`)

/* לוגיקת אב-הטיפוס — משותפת לשלושת הכיוונים. התבניות (TPL) שונות לכל כיוון. */
const TABS = [
  { id: 'today', label: 'היום', icon: 'home' },
  { id: 'nutrition', label: 'תזונה', icon: 'utensils' },
  { id: 'workout', label: 'אימון', icon: 'dumbbell' },
  { id: 'trend', label: 'מגמה', icon: 'chart' },
  { id: 'system', label: 'ערכה', icon: 'more' },
];

const state = {
  tab: 'today',
  dayClosed: false,
  log: DATA.nutrition.log.map((x) => ({ ...x })),
  blocks: DATA.nutrition.blocks.map((x) => ({ ...x })),
  exIndex: 2,
  sets: {},
  rir: {},
  pain: { ...DATA.workout.pain },
  timer: null,
  sheet: null,
  toast: null,
  trendRange: 8,
  painOpen: false,
  prevOpen: false,
};

function fmt(n, d = 1) {
  return Number(n).toFixed(d).replace('-', '\u2212');
}
function num(v, cls = '') {
  return `<span class="num ${cls}">${v}</span>`;
}
function proteinSoFar() {
  return state.log.reduce((s, x) => s + x.p, 0);
}
function kcalSoFar() {
  return state.log.reduce((s, x) => s + x.kcal, 0);
}
function weekAvg() {
  const w = DATA.week.weights.filter((x) => x !== null);
  return { avg: w.reduce((a, b) => a + b, 0) / w.length, count: w.length };
}
function currentEx() {
  return DATA.workout.exercises[state.exIndex];
}
function setsFor(i) {
  if (!state.sets[i]) {
    const ex = DATA.workout.exercises[i];
    const s = ex.suggest || { w: 0, reps: ex.min };
    state.sets[i] = Array.from({ length: ex.sets }, () => ({ done: false, w: s.w, reps: s.reps }));
  }
  return state.sets[i];
}
function doneSets(i) {
  return setsFor(i).filter((s) => s.done).length;
}

/* ---------- פעולות ---------- */
const actions = {
  tab(t) {
    state.tab = t;
    state.sheet = null;
    location.hash = t;
    window.scrollTo(0, 0);
  },
  toggleDay() {
    state.dayClosed = !state.dayClosed;
    if (state.dayClosed) toast('היום נסגר · נכנס לחישובים', () => (state.dayClosed = false));
  },
  logBlock(i) {
    const b = state.blocks[i];
    if (!b) return;
    state.blocks.splice(i, 1);
    const entry = { t: DATA.today.time, name: b.name, qty: b.qty, p: b.p, kcal: b.kcal };
    state.log.push(entry);
    toast(`נרשם: ${b.name} · ${b.p} ג׳ חלבון`, () => {
      state.log = state.log.filter((x) => x !== entry);
      state.blocks.splice(i, 0, b);
    });
  },
  openFood(src, i) {
    const list = src === 'fav' ? DATA.nutrition.favorites : DATA.nutrition.recent;
    const item = list[i];
    state.sheet = { type: 'food', item, grams: item.grams, base: item.grams };
  },
  grams(delta) {
    const s = state.sheet;
    if (!s) return;
    const step = s.item.unit ? 1 : s.item.grams >= 100 ? 25 : 5;
    s.grams = Math.max(step, s.grams + delta * step);
  },
  gramsSet(v) {
    if (state.sheet) state.sheet.grams = Number(v);
  },
  addFood() {
    const s = state.sheet;
    if (!s) return;
    const ratio = s.grams / s.base;
    const entry = {
      t: DATA.today.time,
      name: s.item.name,
      qty: s.item.unit ? `${s.grams} יח׳` : `${s.grams} ג׳`,
      p: Math.round(s.item.p * ratio),
      kcal: Math.round(s.item.kcal * ratio),
    };
    state.log.push(entry);
    state.sheet = null;
    toast(`נרשם: ${entry.name} · ${entry.p} ג׳ חלבון`, () => {
      state.log = state.log.filter((x) => x !== entry);
    });
  },
  copyYesterday() {
    toast('הארוחות של אתמול הועתקו להיום (דמה)', () => {});
  },
  closeSheet() {
    state.sheet = null;
  },
  logSet(i) {
    const sets = setsFor(state.exIndex);
    const s = sets[i];
    if (!s) return;
    if (s.done) {
      s.done = false;
      stopTimer();
      return;
    }
    s.done = true;
    const ex = currentEx();
    const last = i === sets.length - 1;
    startTimer(last ? 90 : ex.rest);
  },
  reps(i, d) {
    const s = setsFor(state.exIndex)[i];
    s.reps = Math.max(1, s.reps + d);
  },
  weight(d) {
    const sets = setsFor(state.exIndex);
    sets.forEach((s) => {
      if (!s.done) s.w = Math.max(0, Math.round((s.w + d * 2.5) * 10) / 10);
    });
  },
  useSuggest() {
    const ex = currentEx();
    setsFor(state.exIndex).forEach((s) => {
      if (!s.done) {
        s.w = ex.suggest.w;
        s.reps = ex.suggest.reps;
      }
    });
  },
  rir(v) {
    state.rir[state.exIndex] = v;
  },
  nextEx() {
    const n = DATA.workout.exercises.length;
    state.exIndex = Math.min(n - 1, state.exIndex + 1);
    state.prevOpen = false;
    stopTimer();
    window.scrollTo(0, 0);
  },
  prevEx() {
    state.exIndex = Math.max(0, state.exIndex - 1);
    state.prevOpen = false;
    stopTimer();
    window.scrollTo(0, 0);
  },
  pain(k, d) {
    state.pain[k] = Math.min(10, Math.max(0, state.pain[k] + d));
  },
  togglePain() {
    state.painOpen = !state.painOpen;
  },
  togglePrev() {
    state.prevOpen = !state.prevOpen;
  },
  skipTimer() {
    stopTimer();
  },
  addTimer(sec) {
    if (state.timer) {
      state.timer.total += sec;
      state.timer.endAt += sec * 1000;
    }
  },
  range(n) {
    state.trendRange = Number(n);
  },
  undo() {
    if (state.toast && state.toast.undo) state.toast.undo();
    state.toast = null;
  },
  dismissToast() {
    state.toast = null;
  },
};

/* ---------- טיימר מנוחה ---------- */
let timerHandle = null;
function startTimer(sec) {
  state.timer = { total: sec, endAt: Date.now() + sec * 1000, left: sec };
  clearInterval(timerHandle);
  timerHandle = setInterval(tickTimer, 250);
}
function stopTimer() {
  state.timer = null;
  clearInterval(timerHandle);
}
function tickTimer() {
  if (!state.timer) return;
  const left = Math.max(0, Math.ceil((state.timer.endAt - Date.now()) / 1000));
  if (left !== state.timer.left) {
    state.timer.left = left;
    const el = document.querySelector('[data-timer-left]');
    if (el) {
      el.textContent = mmss(left);
      const bar = document.querySelector('[data-timer-bar]');
      if (bar) bar.style.width = `${(100 * left) / state.timer.total}%`;
    } else render();
  }
  if (left === 0) {
    stopTimer();
    render();
  }
}
function mmss(s) {
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

/* ---------- טוסט ---------- */
let toastHandle = null;
function toast(msg, undo) {
  state.toast = { msg, undo };
  clearTimeout(toastHandle);
  toastHandle = setTimeout(() => {
    state.toast = null;
    render();
  }, 6000);
}

/* ---------- גרפים (SVG) ---------- */
/* הזמן זורם מימין לשמאל, כמו באפליקציה: הישן בימין, החדש בשמאל. */
function weightChart(weeksBack, W = 342, H = 180) {
  const weeks = DATA.weeks.slice(-weeksBack);
  const daily = DATA.daily.slice(-weeksBack * 7);
  const vals = daily.filter((v) => v !== null).concat(weeks.map((w) => w.avg));
  const lo = Math.floor(Math.min(...vals) - 0.3);
  const hi = Math.ceil(Math.max(...vals) + 0.3);
  const padL = 34, padR = 8, padT = 12, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = daily.length;
  const x = (i) => padL + iw - (iw * (i + 0.5)) / n; /* ימין → שמאל */
  const y = (v) => padT + ih - (ih * (v - lo)) / (hi - lo);
  let dots = '';
  daily.forEach((v, i) => {
    if (v !== null) dots += `<circle class="ch-dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.2"/>`;
  });
  const pts = weeks.map((w, wi) => ({ x: x(wi * 7 + 3), y: y(w.avg), full: w.count === 7, w }));
  const fullPts = pts.filter((p, i) => i < pts.length - 1 || p.full);
  let line = '';
  fullPts.forEach((p, i) => (line += `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)} `));
  const last = pts[pts.length - 1];
  let partial = '';
  if (!last.full && pts.length > 1) {
    const p = pts[pts.length - 2];
    partial = `<path class="ch-line ch-line--partial" d="M${p.x.toFixed(1)} ${p.y.toFixed(1)} L${last.x.toFixed(1)} ${last.y.toFixed(1)}"/><circle class="ch-wk ch-wk--partial" cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4.5"/>`;
  }
  let wk = '';
  fullPts.forEach((p) => (wk += `<circle class="ch-wk" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5"/>`));
  let labels = '';
  weeks.forEach((w, wi) => {
    if (weeksBack <= 8 || wi % 2 === (weeks.length - 1) % 2)
      labels += `<text class="ch-label" x="${x(wi * 7 + 3).toFixed(1)}" y="${H - 8}" text-anchor="middle">${w.label}</text>`;
  });
  const grid = [lo, hi].map((v) => `<line class="ch-grid" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-label" x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף משקל: שקילות יומיות כנקודות וממוצע שבועי כקו">${grid}${dots}<path class="ch-line" d="${line}"/>${partial}${wk}${labels}</svg>`;
}

function waistChart(W = 342, H = 120) {
  const pts = DATA.waist;
  const vals = pts.map((p) => p.cm);
  const lo = Math.floor(Math.min(...vals) - 0.5), hi = Math.ceil(Math.max(...vals) + 0.5);
  const padL = 34, padR = 8, padT = 10, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB;
  const x = (i) => padL + iw - (iw * (i + 0.5)) / pts.length;
  const y = (v) => padT + ih - (ih * (v - lo)) / (hi - lo);
  let line = '', dots = '', labels = '';
  pts.forEach((p, i) => {
    line += `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.cm).toFixed(1)} `;
    dots += `<circle class="ch-wk" cx="${x(i).toFixed(1)}" cy="${y(p.cm).toFixed(1)}" r="3.5"/>`;
    if (i % 2 === (pts.length - 1) % 2) labels += `<text class="ch-label" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${p.d}</text>`;
  });
  const grid = [lo, hi].map((v) => `<line class="ch-grid" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-label" x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('');
  return `<svg class="chart chart--waist" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף מותניים, מדידה שבועית">${grid}<path class="ch-line" d="${line}"/>${dots}${labels}</svg>`;
}

function sparkline(W = 72, H = 24) {
  const w = DATA.weeks.filter((x) => x.count === 7).slice(-6);
  const vals = w.map((x) => x.avg);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const x = (i) => W - 2 - ((W - 4) * i) / (vals.length - 1);
  const y = (v) => 2 + (H - 4) * (1 - (v - lo) / (hi - lo || 1));
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path class="ch-line" d="${d}"/></svg>`;
}

/* ---------- רינדור ---------- */
function render() {
  const root = document.getElementById('app');
  root.innerHTML = TPL.shell(state);
  document.body.dataset.tab = state.tab;
  document.body.classList.toggle('has-sheet', !!state.sheet);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (e.target.matches('.scrim')) {
      actions.closeSheet();
      render();
    }
    return;
  }
  const [name, ...args] = el.dataset.act.split(':');
  if (actions[name]) {
    actions[name](...args);
    render();
  }
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-grams]')) {
    actions.gramsSet(e.target.value);
    const p = document.querySelector('[data-sheet-protein]');
    if (p && state.sheet) p.textContent = Math.round((state.sheet.item.p * state.sheet.grams) / state.sheet.base);
  }
});
function applyHash() {
  const t = location.hash.slice(1);
  if (TABS.some((x) => x.id === t)) state.tab = t;
  /* מצבים לצילום: #workout-timer = אימון עם סט רשום וטיימר רץ; #nutrition-sheet = חלונית כמות פתוחה */
  if (t === 'workout-timer') {
    state.tab = 'workout';
    setsFor(2)[0].done = true;
    state.timer = { total: 90, endAt: Date.now() + 67000, left: 67 };
  }
  if (t === 'nutrition-sheet') {
    state.tab = 'nutrition';
    actions.openFood('fav', 0);
  }
  if (t === 'today-closed') {
    state.tab = 'today';
    state.dayClosed = true;
  }
  render();
}
window.addEventListener('hashchange', applyHash);
applyHash();

</script>
