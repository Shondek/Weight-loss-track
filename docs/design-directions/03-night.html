:root{--bg:#161614;--surface:#1F1F1C;--surface-2:#2A2A26;--ink:#F3EFE6;--ink-2:#C2BDB1;--ink-3:#99948A;--line:#34332E;--line-2:#4A4842;--sage:#A9C99A;--sage-soft:#263126;--amber:#E3B874;--amber-soft:#332A1C;--slate:#9AA4AC;--slate-soft:#262A2D;--accent:#8FB9D8;--accent-soft:#1F2A33;--danger:#E08A6E;}
/* ===== כיוון 3 — לילה (כהה, אימון-תחילה) =====
   פחם חם, בלי מסגרות ובלי צל: שלוש דרגות משטח. מספרים גדולים ב-Rubik,
   כפתור מבטא אחד גדול לכל פעולה. מבטא יחיד: כחול-פלדה. */
:root {
  --font: 'Rubik', system-ui, sans-serif;
  --icon-stroke: 2;
  --r-lg: 16px; --r-md: 12px; --r-chip: 10px; --r-sm: 8px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --tap: 48px;
  --t-hero: 64px; --t-h1: 24px; --t-num: 28px; --t-body: 16px; --t-sub: 14px; --t-label: 13px;
  --nav-h: 64px;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; color-scheme: dark; }
body { margin: 0; font-family: var(--font); font-size: var(--t-body); line-height: 1.5; color: var(--ink); background: var(--bg); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; -webkit-tap-highlight-color: transparent; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.app { max-width: 390px; margin: 0 auto; min-height: 100dvh; }
.main { padding: var(--sp-4) var(--sp-4) calc(var(--nav-h) + var(--sp-6) + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: var(--sp-3); }
h1, h2, p, ol, ul { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.ic { width: 20px; height: 20px; stroke-width: var(--icon-stroke); flex: 0 0 auto; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
.sub { font-size: var(--t-sub); color: var(--ink-2); line-height: 1.45; }
.sub .ic { width: 16px; height: 16px; }

/* --- כותרות --- */
.top { padding-top: var(--sp-2); display: grid; gap: 2px; }
.top--row { display: flex; align-items: center; gap: var(--sp-3); }
.top--row .top__eyebrow { white-space: nowrap; }
.top__eyebrow { font-size: var(--t-label); font-weight: 500; color: var(--ink-3); }
.h1 { font-size: var(--t-h1); font-weight: 500; line-height: 1.25; }
.h1__unit { font-size: var(--t-sub); font-weight: 400; color: var(--ink-2); }
.h2 { font-size: var(--t-label); font-weight: 500; color: var(--ink-3); letter-spacing: 0.02em; }

/* --- פאנלים: משטח, בלי מסגרת --- */
.panel { background: var(--surface); border-radius: var(--r-lg); padding: var(--sp-4); display: grid; gap: var(--sp-3); }
.panel--hero { padding: var(--sp-5) var(--sp-4) var(--sp-4); }
.panel__label { font-size: var(--t-label); font-weight: 500; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.panel__label .ic { width: 16px; height: 16px; }
.panel__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); }
.hero-row { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
.hero { font-size: var(--t-hero); font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
.hero-unit { font-size: 18px; color: var(--ink-2); }
.hero-row .chip { margin-inline-start: auto; }
.hero-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; }
.trend-row { display: flex; align-items: center; gap: var(--sp-2); padding-top: var(--sp-2); border-top: 1px solid var(--line); }
.spark { width: 56px; height: 18px; }
.spark .ch-line { stroke: var(--accent); stroke-width: 2; fill: none; }
.big-stat .num { font-size: var(--t-num); font-weight: 400; }

/* 7 ימים: עמודות */
.d7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--sp-1); }
.d7__cell { display: grid; gap: 4px; justify-items: stretch; text-align: center; font-size: 12px; color: var(--ink-3); }
.d7__bar { height: 6px; border-radius: 3px; background: var(--surface-2); }
.d7__cell.is-done .d7__bar { background: var(--ink); }
.d7__cell.is-missing .d7__bar { background: var(--amber-soft); border: 1px dashed var(--amber); }
.d7__cell.is-today .d7__letter { color: var(--ink); font-weight: 500; }

/* --- צ׳יפים --- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-label); font-weight: 500; padding: 4px 10px; border-radius: var(--r-chip); line-height: 1.3; white-space: nowrap; }
.chip .ic { width: 14px; height: 14px; }
.chip--sage { background: var(--sage-soft); color: var(--sage); }
.chip--amber { background: var(--amber-soft); color: var(--amber); }
.chip--slate { background: var(--slate-soft); color: var(--slate); }
.chip--btn { background: var(--surface-2); color: var(--ink); min-height: 44px; padding: 0 14px; font-size: 16px; justify-content: center; }
.chip--btn.is-on { background: var(--accent); color: var(--bg); }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--sp-2); }

/* --- שורות מדדים --- */
.rows { background: var(--surface); border-radius: var(--r-lg); padding: 0 var(--sp-4); }
.mrow { display: flex; align-items: center; gap: var(--sp-3); min-height: 64px; padding: var(--sp-2) 0; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }
.mrow--panel { background: var(--surface); border-radius: var(--r-lg); padding: var(--sp-2) var(--sp-4); border-top: 0; }
.mrow--btn { appearance: none; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: start; }
.mrow--btn:first-child { border-top: 0; }
.mrow__icon { color: var(--ink-3); display: inline-flex; }
.mrow__icon .ic { width: 22px; height: 22px; }
.mrow.is-closed .mrow__icon { color: var(--sage); }
.mrow__label { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.mrow__val { display: flex; align-items: baseline; gap: 4px; font-size: var(--t-num); line-height: 1; }
.mrow__unit { font-size: var(--t-sub); color: var(--ink-2); }
.plus { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 6px 0 4px; }
.bar--thick { height: 10px; border-radius: 5px; margin: 0; }
.bar__fill { height: 100%; background: var(--accent); border-radius: inherit; }

.next__row { display: flex; align-items: center; gap: var(--sp-3); }
.next__name { font-size: 18px; font-weight: 500; }
.next__later { padding-top: var(--sp-2); border-top: 1px solid var(--line); }

/* קריאה לפעולה גדולה */
.cta { appearance: none; border: 0; width: 100%; min-height: 72px; border-radius: var(--r-lg); background: var(--accent-soft); color: var(--ink); display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); text-align: start; }
.cta__icon { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--accent); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; }
.cta__icon .ic { width: 24px; height: 24px; }
.cta__title { display: block; font-size: 18px; font-weight: 500; }
.cta > .ic:last-child { color: var(--accent); }

/* --- כפתורים --- */
.btn { appearance: none; min-height: var(--tap); padding: 0 var(--sp-4); border: 0; border-radius: var(--r-md); background: var(--surface-2); color: var(--ink); font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn--accent { background: var(--accent); color: var(--bg); }
.btn--light { background: var(--ink); color: var(--bg); }
.btn--ghost { background: none; color: var(--ink-2); padding-inline: var(--sp-2); }
.btn--sm { min-height: 44px; margin-block: -8px; font-size: var(--t-sub); }
.btn--block { width: 100%; }
.btn--tall { min-height: 60px; font-size: 18px; }
.btn .ic { width: 18px; height: 18px; }
.icon-btn { appearance: none; border: 0; border-radius: var(--r-md); background: var(--surface); width: var(--tap); height: var(--tap); display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.icon-btn:disabled { opacity: 0.35; }
.actions { display: flex; gap: var(--sp-2); align-items: center; }

/* --- סטפר --- */
.step { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: var(--r-md); }
.step__btn { appearance: none; border: 0; background: none; width: var(--tap); height: var(--tap); display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.step__btn:disabled { opacity: 0.3; }
.step__val { min-width: 60px; text-align: center; font-size: 24px; }
.step--small .step__btn { width: 44px; height: 44px; }
.step--small .step__val { min-width: 44px; font-size: 20px; }
.wrow { display: flex; align-items: center; gap: var(--sp-3); justify-content: space-between; }

/* --- אימון --- */
.prog { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; width: 100%; margin-top: 6px; }
.prog__seg { height: 4px; border-radius: 2px; background: var(--surface-2); }
.prog__seg.is-done { background: var(--ink-2); }
.prog__seg.is-current { background: var(--accent); }
.exhead { display: grid; gap: 4px; padding: var(--sp-2) 0; }
.ex-name { font-size: 30px; font-weight: 500; line-height: 1.15; letter-spacing: -0.01em; }
.suggest__main { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.suggest__val { display: flex; align-items: baseline; gap: 4px; font-size: 40px; font-weight: 300; line-height: 1; margin-top: 6px; color: var(--accent); }
.suggest__unit, .suggest__x { font-size: var(--t-sub); color: var(--ink-2); font-weight: 400; }
.suggest__x { margin-inline: 4px; }
.prev { appearance: none; border: 0; background: var(--surface-2); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3); text-align: start; display: grid; gap: 2px; }
.prev__nums { font-size: 18px; white-space: nowrap; }
.prev__more { padding-top: var(--sp-2); border-top: 1px solid var(--line); }

/* שקילות יומיות ל-9 שבועות — נגזרות דטרמיניסטית מהממוצעים השבועיים.
   רעש קטן וקבוע (לא אקראי) כדי שהצילומים יהיו זהים בכל ריצה. */
function dailyWeights() {
  const noise = [0.4, -0.2, 0.1, -0.5, 0.3, 0.0, -0.1, 0.5, -0.3, 0.2, -0.4, 0.1, 0.3, -0.2];
  const out = [];
  DATA.weeks.forEach((w, wi) => {
    for (let d = 0; d < 7; d++) {
      const i = wi * 7 + d;
      if (wi === DATA.weeks.length - 1) {
        const v = DATA.week.weights[d];
        out.push(v === null ? null : v);
      } else if (w.count < 7 && d === 2) {
        out.push(null);
      } else {
        out.push(Math.round((w.avg + noise[(i * 5) % noise.length]) * 10) / 10);
      }
    }
  });
  return out;
}
DATA.daily = dailyWeights();

/* לוגיקת אב-הטיפוס — משותפת לשלושת הכיוונים. התבניות (TPL) שונות לכל כיוון. */
const TABS = [
  { id: 'today', label: 'היום', icon: 'home' },
  { id: 'nutrition', label: 'תזונה', icon: 'utensils' },
  { id: 'workout', label: 'אימון', icon: 'dumbbell' },
  { id: 'trend', label: 'מגמה', icon: 'chart' },
  { id: 'system', label: 'ערכה', icon: 'more' },
];

const state = {
  tab: 'today',
  dayClosed: false,
  log: DATA.nutrition.log.map((x) => ({ ...x })),
  blocks: DATA.nutrition.blocks.map((x) => ({ ...x })),
  exIndex: 2,
  sets: {},
  rir: {},
  pain: { ...DATA.workout.pain },
  timer: null,
  sheet: null,
  toast: null,
  trendRange: 8,
  painOpen: false,
  prevOpen: false,
};

function fmt(n, d = 1) {
  return Number(n).toFixed(d).replace('-', '\u2212');
}
function num(v, cls = '') {
  return `<span class="num ${cls}">${v}</span>`;
}
function proteinSoFar() {
  return state.log.reduce((s, x) => s + x.p, 0);
}
function kcalSoFar() {
  return state.log.reduce((s, x) => s + x.kcal, 0);
}
function weekAvg() {
  const w = DATA.week.weights.filter((x) => x !== null);
  return { avg: w.reduce((a, b) => a + b, 0) / w.length, count: w.length };
}
function currentEx() {
  return DATA.workout.exercises[state.exIndex];
}
function setsFor(i) {
  if (!state.sets[i]) {
    const ex = DATA.workout.exercises[i];
    const s = ex.suggest || { w: 0, reps: ex.min };
    state.sets[i] = Array.from({ length: ex.sets }, () => ({ done: false, w: s.w, reps: s.reps }));
  }
  return state.sets[i];
}
function doneSets(i) {
  return setsFor(i).filter((s) => s.done).length;
}

/* ---------- פעולות ---------- */
const actions = {
  tab(t) {
    state.tab = t;
    state.sheet = null;
    location.hash = t;
    window.scrollTo(0, 0);
  },
  toggleDay() {
    state.dayClosed = !state.dayClosed;
    if (state.dayClosed) toast('היום נסגר · נכנס לחישובים', () => (state.dayClosed = false));
  },
  logBlock(i) {
    const b = state.blocks[i];
    if (!b) return;
    state.blocks.splice(i, 1);
    const entry = { t: DATA.today.time, name: b.name, qty: b.qty, p: b.p, kcal: b.kcal };
    state.log.push(entry);
    toast(`נרשם: ${b.name} · ${b.p} ג׳ חלבון`, () => {
      state.log = state.log.filter((x) => x !== entry);
      state.blocks.splice(i, 0, b);
    });
  },
  openFood(src, i) {
    const list = src === 'fav' ? DATA.nutrition.favorites : DATA.nutrition.recent;
    const item = list[i];
    state.sheet = { type: 'food', item, grams: item.grams, base: item.grams };
  },
  grams(delta) {
    const s = state.sheet;
    if (!s) return;
    const step = s.item.unit ? 1 : s.item.grams >= 100 ? 25 : 5;
    s.grams = Math.max(step, s.grams + delta * step);
  },
  gramsSet(v) {
    if (state.sheet) state.sheet.grams = Number(v);
  },
  addFood() {
    const s = state.sheet;
    if (!s) return;
    const ratio = s.grams / s.base;
    const entry = {
      t: DATA.today.time,
      name: s.item.name,
      qty: s.item.unit ? `${s.grams} יח׳` : `${s.grams} ג׳`,
      p: Math.round(s.item.p * ratio),
      kcal: Math.round(s.item.kcal * ratio),
    };
    state.log.push(entry);
    state.sheet = null;
    toast(`נרשם: ${entry.name} · ${entry.p} ג׳ חלבון`, () => {
      state.log = state.log.filter((x) => x !== entry);
    });
  },
  copyYesterday() {
    toast('הארוחות של אתמול הועתקו להיום (דמה)', () => {});
  },
  closeSheet() {
    state.sheet = null;
  },
  logSet(i) {
    const sets = setsFor(state.exIndex);
    const s = sets[i];
    if (!s) return;
    if (s.done) {
      s.done = false;
      stopTimer();
      return;
    }
    s.done = true;
    const ex = currentEx();
    const last = i === sets.length - 1;
    startTimer(last ? 90 : ex.rest);
  },
  reps(i, d) {
    const s = setsFor(state.exIndex)[i];
    s.reps = Math.max(1, s.reps + d);
  },
  weight(d) {
    const sets = setsFor(state.exIndex);
    sets.forEach((s) => {
      if (!s.done) s.w = Math.max(0, Math.round((s.w + d * 2.5) * 10) / 10);
    });
  },
  useSuggest() {
    const ex = currentEx();
    setsFor(state.exIndex).forEach((s) => {
      if (!s.done) {
        s.w = ex.suggest.w;
        s.reps = ex.suggest.reps;
      }
    });
  },
  rir(v) {
    state.rir[state.exIndex] = v;
  },
  nextEx() {
    const n = DATA.workout.exercises.length;
    state.exIndex = Math.min(n - 1, state.exIndex + 1);
    state.prevOpen = false;
    stopTimer();
    window.scrollTo(0, 0);
  },
  prevEx() {
    state.exIndex = Math.max(0, state.exIndex - 1);
    state.prevOpen = false;
    stopTimer();
    window.scrollTo(0, 0);
  },
  pain(k, d) {
    state.pain[k] = Math.min(10, Math.max(0, state.pain[k] + d));
  },
  togglePain() {
    state.painOpen = !state.painOpen;
  },
  togglePrev() {
    state.prevOpen = !state.prevOpen;
  },
  skipTimer() {
    stopTimer();
  },
  addTimer(sec) {
    if (state.timer) {
      state.timer.total += sec;
      state.timer.endAt += sec * 1000;
    }
  },
  range(n) {
    state.trendRange = Number(n);
  },
  undo() {
    if (state.toast && state.toast.undo) state.toast.undo();
    state.toast = null;
  },
  dismissToast() {
    state.toast = null;
  },
};

/* ---------- טיימר מנוחה ---------- */
let timerHandle = null;
function startTimer(sec) {
  state.timer = { total: sec, endAt: Date.now() + sec * 1000, left: sec };
  clearInterval(timerHandle);
  timerHandle = setInterval(tickTimer, 250);
}
function stopTimer() {
  state.timer = null;
  clearInterval(timerHandle);
}
function tickTimer() {
  if (!state.timer) return;
  const left = Math.max(0, Math.ceil((state.timer.endAt - Date.now()) / 1000));
  if (left !== state.timer.left) {
    state.timer.left = left;
    const el = document.querySelector('[data-timer-left]');
    if (el) {
      el.textContent = mmss(left);
      const bar = document.querySelector('[data-timer-bar]');
      if (bar) bar.style.width = `${(100 * left) / state.timer.total}%`;
    } else render();
  }
  if (left === 0) {
    stopTimer();
    render();
  }
}
function mmss(s) {
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

/* ---------- טוסט ---------- */
let toastHandle = null;
function toast(msg, undo) {
  state.toast = { msg, undo };
  clearTimeout(toastHandle);
  toastHandle = setTimeout(() => {
    state.toast = null;
    render();
  }, 6000);
}

/* ---------- גרפים (SVG) ---------- */
/* הזמן זורם מימין לשמאל, כמו באפליקציה: הישן בימין, החדש בשמאל. */
function weightChart(weeksBack, W = 342, H = 180) {
  const weeks = DATA.weeks.slice(-weeksBack);
  const daily = DATA.daily.slice(-weeksBack * 7);
  const vals = daily.filter((v) => v !== null).concat(weeks.map((w) => w.avg));
  const lo = Math.floor(Math.min(...vals) - 0.3);
  const hi = Math.ceil(Math.max(...vals) + 0.3);
  const padL = 34, padR = 8, padT = 12, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = daily.length;
  const x = (i) => padL + iw - (iw * (i + 0.5)) / n; /* ימין → שמאל */
  const y = (v) => padT + ih - (ih * (v - lo)) / (hi - lo);
  let dots = '';
  daily.forEach((v, i) => {
    if (v !== null) dots += `<circle class="ch-dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.2"/>`;
  });
  const pts = weeks.map((w, wi) => ({ x: x(wi * 7 + 3), y: y(w.avg), full: w.count === 7, w }));
  const fullPts = pts.filter((p, i) => i < pts.length - 1 || p.full);
  let line = '';
  fullPts.forEach((p, i) => (line += `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)} `));
  const last = pts[pts.length - 1];
  let partial = '';
  if (!last.full && pts.length > 1) {
    const p = pts[pts.length - 2];
    partial = `<path class="ch-line ch-line--partial" d="M${p.x.toFixed(1)} ${p.y.toFixed(1)} L${last.x.toFixed(1)} ${last.y.toFixed(1)}"/><circle class="ch-wk ch-wk--partial" cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4.5"/>`;
  }
  let wk = '';
  fullPts.forEach((p) => (wk += `<circle class="ch-wk" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5"/>`));
  let labels = '';
  weeks.forEach((w, wi) => {
    if (weeksBack <= 8 || wi % 2 === (weeks.length - 1) % 2)
      labels += `<text class="ch-label" x="${x(wi * 7 + 3).toFixed(1)}" y="${H - 8}" text-anchor="middle">${w.label}</text>`;
  });
  const grid = [lo, hi].map((v) => `<line class="ch-grid" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-label" x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף משקל: שקילות יומיות כנקודות וממוצע שבועי כקו">${grid}${dots}<path class="ch-line" d="${line}"/>${partial}${wk}${labels}</svg>`;
}

function waistChart(W = 342, H = 120) {
  const pts = DATA.waist;
  const vals = pts.map((p) => p.cm);
  const lo = Math.floor(Math.min(...vals) - 0.5), hi = Math.ceil(Math.max(...vals) + 0.5);
  const padL = 34, padR = 8, padT = 10, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB;
  const x = (i) => padL + iw - (iw * (i + 0.5)) / pts.length;
  const y = (v) => padT + ih - (ih * (v - lo)) / (hi - lo);
  let line = '', dots = '', labels = '';
  pts.forEach((p, i) => {
    line += `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.cm).toFixed(1)} `;
    dots += `<circle class="ch-wk" cx="${x(i).toFixed(1)}" cy="${y(p.cm).toFixed(1)}" r="3.5"/>`;
    if (i % 2 === (pts.length - 1) % 2) labels += `<text class="ch-label" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${p.d}</text>`;
  });
  const grid = [lo, hi].map((v) => `<line class="ch-grid" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-label" x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('');
  return `<svg class="chart chart--waist" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף מותניים, מדידה שבועית">${grid}<path class="ch-line" d="${line}"/>${dots}${labels}</svg>`;
}

function sparkline(W = 72, H = 24) {
  const w = DATA.weeks.filter((x) => x.count === 7).slice(-6);
  const vals = w.map((x) => x.avg);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const x = (i) => W - 2 - ((W - 4) * i) / (vals.length - 1);
  const y = (v) => 2 + (H - 4) * (1 - (v - lo) / (hi - lo || 1));
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path class="ch-line" d="${d}"/></svg>`;
}

/* ---------- רינדור ---------- */
function render() {
  const root = document.getElementById('app');
  root.innerHTML = TPL.shell(state);
  document.body.dataset.tab = state.tab;
  document.body.classList.toggle('has-sheet', !!state.sheet);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (e.target.matches('.scrim')) {
      actions.closeSheet();
      render();
    }
    return;
  }
  const [name, ...args] = el.dataset.act.split(':');
  if (actions[name]) {
    actions[name](...args);
    render();
  }
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-grams]')) {
    actions.gramsSet(e.target.value);
    const p = document.querySelector('[data-sheet-protein]');
    if (p && state.sheet) p.textContent = Math.round((state.sheet.item.p * state.sheet.grams) / state.sheet.base);
  }
});
function applyHash() {
  const t = location.hash.slice(1);
  if (TABS.some((x) => x.id === t)) state.tab = t;
  /* מצבים לצילום: #workout-timer = אימון עם סט רשום וטיימר רץ; #nutrition-sheet = חלונית כמות פתוחה */
  if (t === 'workout-timer') {
    state.tab = 'workout';
    setsFor(2)[0].done = true;
    state.timer = { total: 90, endAt: Date.now() + 67000, left: 67 };
  }
  if (t === 'nutrition-sheet') {
    state.tab = 'nutrition';
    actions.openFood('fav', 0);
  }
  if (t === 'today-closed') {
    state.tab = 'today';
    state.dayClosed = true;
  }
  render();
}
window.addEventListener('hashchange', applyHash);
applyHash();

</script>
